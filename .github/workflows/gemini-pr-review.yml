name: Gemini AI Pull Request Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-review:
    # Run on PR events, or if a user comments "@gemini-cli /review"
    if: ${{ github.event_name == 'pull_request' || contains(github.event.comment.body, '@gemini-cli /review') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch the PR diff
          
      - name: Run Gemini Code Review
        uses: google-github-actions/run-gemini-cli@v1
        with:
          command: '/review'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
